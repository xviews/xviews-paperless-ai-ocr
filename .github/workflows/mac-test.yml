# Funktionstest der Mac-Version auf einem macOS-Rechner von GitHub (nur von Hand: Actions → Mac-Test → Run workflow).
# Baut die App, startet sie aus der DMG, schickt wie Paperless einen zweiseitigen Testbrief über die Azure-Schnittstelle
# und prüft Text, Seitengrößen und das durchsuchbare PDF. Statt eines echten KI-Modells antwortet ein kleiner
# OpenAI-kompatibler Ersatzserver mit festem Text und speichert die Seitenbilder, die PDFium gerendert hat.
# Danach startet die App neu mit Ollama-Einstellung; derselbe Ersatzserver spielt Ollama mit beiden Arten von
# Schleife (endlose Zeilen, Fehler 500 „token repeat limit reached“) und prüft Abbruch und zweiten Versuch.
# Bildschirmfotos, Seitenbilder, Ergebnis-PDF und Protokoll liegen danach als Download unter dem Lauf.
name: Mac-Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OUT: ${{ github.workspace }}/test-out
      KEY: mac-test-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Bauen
        run: bash src/build-mac.sh

      - name: Aus der DMG holen
        run: |
          mkdir -p "$OUT"
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg "app/mac/XviewsPaperlessAiOcr-mac-$arch.dmg"
          ls -la /tmp/dmg
          test -L /tmp/dmg/Applications
          cp -R "/tmp/dmg/Xviews Paperless AI-OCR.app" /tmp/
          hdiutil detach /tmp/dmg
          codesign --verify --deep --strict "/tmp/Xviews Paperless AI-OCR.app"
          echo "Aus der DMG geholt und Signatur geprüft ($arch)"

      - name: Ersatz-KI-Server und Testbrief vorbereiten
        run: |
          cat > /tmp/fake_ai.py <<'EOF'
          # Ersatzserver in zwei Rollen, je nach Pfad:
          # OpenAI-kompatibel (/v1/...): ein Modell "test-vision", fester Text, speichert jedes Bild.
          # Ollama (/api/...): antwortet als Strom wie Ollama und spielt beide Schleifen durch:
          #   Seite 1 erst endlos "Datum  Datum  Datum" (das Tool muss selbst abbrechen), dann sauber;
          #   Seite 2 erst Fehler 500 "token repeat limit reached" (wie Ollama), dann sauber.
          import base64, json, os, sys, time
          from http.server import BaseHTTPRequestHandler, HTTPServer
          out = sys.argv[1]; count = 0; ollama = 0
          def note(text):
              print(text, flush=True)
          class H(BaseHTTPRequestHandler):
              def reply(self, obj, status=200):
                  body = json.dumps(obj).encode()
                  self.send_response(status); self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def body(self):
                  # .NET schickt JSON ohne Content-Length in Stücken (chunked)
                  if self.headers["Content-Length"]:
                      return self.rfile.read(int(self.headers["Content-Length"]))
                  data = b""
                  while (size := int(self.rfile.readline().strip(), 16)):
                      data += self.rfile.read(size); self.rfile.readline()
                  self.rfile.readline()
                  return data
              def do_GET(self):
                  if self.path == "/api/version": self.reply({"version": "0.0.0-test"})
                  elif self.path == "/api/tags": self.reply({"models": [{"name": "test-vision"}]})
                  else: self.reply({"object": "list", "data": [{"id": "test-vision", "object": "model"}]})
              def do_POST(self):
                  global count, ollama
                  data = json.loads(self.body())
                  if self.path == "/api/show": return self.reply({"capabilities": ["completion", "vision"]})
                  if self.path == "/api/chat": return self.chat_ollama(data)
                  count += 1
                  for part in data["messages"][0]["content"]:
                      if part.get("type") == "image_url":
                          png = base64.b64decode(part["image_url"]["url"].split("base64,", 1)[1])
                          open(os.path.join(out, f"seite-{count}.png"), "wb").write(png)
                  self.reply({"choices": [{"message": {"role": "assistant", "content": f"Hallo Paperless\nMac-Test Seite {count} äöüß"}}]})
              def chat_ollama(self, data):
                  global ollama
                  ollama += 1; o = data.get("options", {})
                  note(f"ollama {ollama}: stream={data.get('stream')} temperature={o.get('temperature')} repeat_penalty={o.get('repeat_penalty')}")
                  if ollama == 3:
                      return self.reply({"error": "prediction aborted, token repeat limit reached"}, 500)
                  # Ohne Content-Length endet die Antwort mit dem Schließen der Verbindung, wie ein Strom
                  self.send_response(200); self.send_header("Content-Type", "application/x-ndjson"); self.end_headers()
                  def piece(text, done=False):
                      self.wfile.write((json.dumps({"message": {"role": "assistant", "content": text}, "done": done}) + "\n").encode())
                      self.wfile.flush()
                  if ollama == 1:
                      start = time.time()
                      try:
                          for i in range(2000):
                              piece("Datum  Datum  Datum\n"); time.sleep(0.05)
                          note("ollama 1: alle 2000 Zeilen geschickt, NICHT abgebrochen")
                      except (BrokenPipeError, ConnectionResetError):
                          note(f"ollama 1: vom Tool abgebrochen nach {i} Zeilen und {time.time() - start:.1f} s")
                      return
                  page = 1 if ollama == 2 else 2
                  for text in ["Hallo Paperless\n", f"Ollama Seite {page} ", "äöüß"]:
                      piece(text)
                  piece("", done=True)
          HTTPServer(("127.0.0.1", 8080), H).serve_forever()
          EOF

          cat > /tmp/make_pdf.py <<'EOF'
          # Zweiseitiges A4-PDF mit etwas Text und einem Rahmen, ohne Zusatzpakete.
          import sys
          pages = 2; objs = []
          objs.append("<< /Type /Catalog /Pages 2 0 R >>")
          kids = " ".join(f"{4 + 2 * i} 0 R" for i in range(pages))
          objs.append(f"<< /Type /Pages /Kids [{kids}] /Count {pages} >>")
          objs.append("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>")
          for i in range(pages):
              stream = f"BT /F1 28 Tf 72 740 Td (Testbrief Seite {i + 1}) Tj ET 60 60 475 722 re S"
              objs.append(f"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents {5 + 2 * i} 0 R >>")
              objs.append(f"<< /Length {len(stream)} >>\nstream\n{stream}\nendstream")
          pdf = "%PDF-1.4\n"; offsets = []
          for n, o in enumerate(objs, 1):
              offsets.append(len(pdf)); pdf += f"{n} 0 obj\n{o}\nendobj\n"
          xref = len(pdf)
          pdf += f"xref\n0 {len(objs) + 1}\n0000000000 65535 f \n" + "".join(f"{o:010d} 00000 n \n" for o in offsets)
          pdf += f"trailer\n<< /Size {len(objs) + 1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n"
          open(sys.argv[1], "w", encoding="latin-1").write(pdf)
          EOF
          python3 /tmp/make_pdf.py "$OUT/testbrief.pdf"

          # Einstellungen wie nach der Einrichtung: OpenAI-kompatibler Server, festes Modell, fester Schlüssel
          dir="$HOME/Library/Application Support/Xviews Paperless AI-OCR"
          mkdir -p "$dir"
          cat > "$dir/einstellungen.json" <<EOF
          { "Port": 5050, "ApiKey": "$KEY", "Server": "openai", "ServerUrl": "http://127.0.0.1:8080", "Model": "test-vision" }
          EOF

      - name: App starten
        run: |
          python3 /tmp/fake_ai.py "$OUT" > "$OUT/ki-server.log" 2>&1 &
          # Wie ein Doppelklick im Finder, damit macOS die Angaben der App (Info.plist) beachtet
          open "/tmp/Xviews Paperless AI-OCR.app" --args --autostart
          for i in $(seq 60); do
            if curl -sf http://127.0.0.1:5050/ > "$OUT/start.txt"; then cat "$OUT/start.txt"; echo; exit 0; fi
            sleep 1
          done
          echo "::error::Die App antwortet nach 60 Sekunden nicht auf Port 5050"
          exit 1

      - name: Schnittstelle prüfen
        run: |
          api=http://127.0.0.1:5050/documentintelligence/documentModels/prebuilt-read
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Ocp-Apim-Subscription-Key: falsch' \
                 -H 'Content-Type: application/json' -d '{"base64Source":""}' "$api:analyze?api-version=2024-11-30")
          [ "$code" = 401 ] || { echo "::error::Falscher Schlüssel ergab $code statt 401"; exit 1; }
          echo "Falscher Schlüssel: 401, richtig abgewiesen"

          printf '{"base64Source":"%s"}' "$(base64 -i "$OUT/testbrief.pdf")" > /tmp/body.json
          loc=$(curl -s -D - -o /dev/null -X POST -H "Ocp-Apim-Subscription-Key: $KEY" -H 'Content-Type: application/json' \
                --data-binary @/tmp/body.json "$api:analyze?api-version=2024-11-30" | awk -F': ' 'tolower($1)=="operation-location"{print $2}' | tr -d '\r')
          [ -n "$loc" ] || { echo "::error::Keine Operation-Location"; exit 1; }
          for i in $(seq 60); do
            sleep 2
            curl -s -H "Ocp-Apim-Subscription-Key: $KEY" "$loc" > "$OUT/ergebnis.json"
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$OUT/ergebnis.json")
            [ "$status" = succeeded ] || [ "$status" = failed ] && break
          done
          python3 -m json.tool "$OUT/ergebnis.json"
          python3 - "$OUT/ergebnis.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["status"] == "succeeded", f"Status {r['status']}: {r.get('error')}"
          a = r["analyzeResult"]; pages = a["pages"]
          assert len(pages) == 2, f"{len(pages)} Seiten statt 2"
          for p in pages:
              assert abs(p["width"] - 8.26) < 0.05 and abs(p["height"] - 11.69) < 0.05, f"Seitengröße {p['width']} x {p['height']}"
          assert "Mac-Test Seite 1" in a["content"] and "Mac-Test Seite 2" in a["content"], a["content"]
          assert "äöüß" in a["content"], "Umlaute fehlen"
          print("Ergebnis stimmt: 2 Seiten in A4, Text beider Seiten, Umlaute")
          EOF

          curl -sf -H "Ocp-Apim-Subscription-Key: $KEY" "${loc%%\?*}/pdf?api-version=2024-11-30" -o "$OUT/ergebnis.pdf"
          head -c 5 "$OUT/ergebnis.pdf" | grep -q '%PDF-' || { echo "::error::Kein durchsuchbares PDF"; exit 1; }
          echo "Durchsuchbares PDF: $(wc -c < "$OUT/ergebnis.pdf") Bytes"

      - name: Seitenbilder von PDFium prüfen
        run: |
          for n in 1 2; do
            f="$OUT/seite-$n.png"
            [ -f "$f" ] || { echo "::error::Seitenbild $n fehlt"; exit 1; }
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}'); h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "Seite $n: $w x $h Pixel"
            # A4 bei 200 dpi: 1654 x 2339
            [ "$w" -ge 1600 ] && [ "$w" -le 1700 ] && [ "$h" -ge 2280 ] && [ "$h" -le 2400 ] || { echo "::error::Seite $n hat $w x $h"; exit 1; }
          done

      - name: Ollama mit Schleifen prüfen
        run: |
          # App mit Ollama-Einstellung neu starten (Einstellungen werden nur beim Start gelesen)
          pkill -f XviewsPaperlessAiOcr || true
          for i in $(seq 20); do pgrep -f XviewsPaperlessAiOcr > /dev/null || break; sleep 1; done
          dir="$HOME/Library/Application Support/Xviews Paperless AI-OCR"
          cat > "$dir/einstellungen.json" <<EOF
          { "Port": 5050, "ApiKey": "$KEY", "Server": "ollama", "ServerUrl": "http://127.0.0.1:8080", "Model": "test-vision", "StartOllamaOnDemand": false }
          EOF
          open "/tmp/Xviews Paperless AI-OCR.app" --args --autostart
          for i in $(seq 60); do curl -sf http://127.0.0.1:5050/ > /dev/null && break; sleep 1; done

          api=http://127.0.0.1:5050/documentintelligence/documentModels/prebuilt-read
          loc=$(curl -s -D - -o /dev/null -X POST -H "Ocp-Apim-Subscription-Key: $KEY" -H 'Content-Type: application/json' \
                --data-binary @/tmp/body.json "$api:analyze?api-version=2024-11-30" | awk -F': ' 'tolower($1)=="operation-location"{print $2}' | tr -d '\r')
          [ -n "$loc" ] || { echo "::error::Keine Operation-Location"; exit 1; }
          for i in $(seq 60); do
            sleep 2
            curl -s -H "Ocp-Apim-Subscription-Key: $KEY" "$loc" > "$OUT/ergebnis-ollama.json"
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$OUT/ergebnis-ollama.json")
            [ "$status" = succeeded ] || [ "$status" = failed ] && break
          done
          echo "--- Ersatz-Ollama ---"; cat "$OUT/ki-server.log"
          python3 - "$OUT/ergebnis-ollama.json" "$OUT/ki-server.log" <<'EOF'
          import json, re, sys
          r = json.load(open(sys.argv[1])); server = open(sys.argv[2]).read()
          assert r["status"] == "succeeded", f"Status {r['status']}: {r.get('error')}"
          c = r["analyzeResult"]["content"]
          assert "Ollama Seite 1 äöüß" in c and "Ollama Seite 2 äöüß" in c, c
          assert "Datum" not in c, "Text der Schleife ist im Ergebnis gelandet"
          m = re.search(r"ollama 1: vom Tool abgebrochen nach (\d+) Zeilen", server)
          assert m and int(m.group(1)) < 100, "Das Tool hat die Zeilen-Schleife nicht früh abgebrochen"
          assert "ollama 1: stream=True temperature=0 repeat_penalty=None" in server, "Erster Versuch nicht mit Temperatur 0 als Strom"
          for n in (2, 4):
              assert f"ollama {n}: stream=True temperature=0.3 repeat_penalty=1.15" in server, f"Zweiter Versuch {n} ohne Wiederholungsbremse"
          print(f"Ollama stimmt: Schleife nach {m.group(1)} Zeilen abgebrochen, Fehler 500 abgefangen, zweiter Versuch mit Bremse, beide Seiten gelesen")
          EOF
          n=$(cat "$dir/logs/"*.log | grep -c "zweiter Versuch" || true)
          [ "$n" = 2 ] || { echo "::error::Im Protokoll stehen $n statt 2 zweite Versuche"; exit 1; }

      - name: Bildschirmfotos
        if: always()
        run: |
          screencapture -x "$OUT/1-nach-dem-dokument.png" || echo "screencapture fehlgeschlagen"
          # Zweites Öffnen meldet macOS der laufenden App, die dann das Info-Fenster zeigt
          open "/tmp/Xviews Paperless AI-OCR.app"
          sleep 5
          screencapture -x "$OUT/2-info-fenster.png" || echo "screencapture fehlgeschlagen"

      - name: Protokoll einsammeln und beenden
        if: always()
        run: |
          cp "$HOME/Library/Application Support/Xviews Paperless AI-OCR/logs/"*.log "$OUT/" 2>/dev/null || true
          cat "$OUT"/ocr-*.log 2>/dev/null || true
          pkill -f XviewsPaperlessAiOcr || true
          pkill -f fake_ai.py || true

      - name: Ergebnisse ablegen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test
          path: test-out/
