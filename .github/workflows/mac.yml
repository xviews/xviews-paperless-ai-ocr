# Baut die Mac-Version auf einem macOS-Rechner von GitHub.
# - Release veröffentlicht: hängt beide ZIPs an das Release (die Update-Suche der App findet sie dort).
# - Von Hand (Actions → Mac-Version → Run workflow): ZIPs nur als Download unter dem Lauf, zum Testen.
name: Mac-Version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Bauen
        run: bash src/build-mac.sh

      - name: Als Download unter dem Lauf ablegen
        uses: actions/upload-artifact@v7
        with:
          name: mac-zips
          path: app/mac/*.zip

      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/mac/*.zip --clobber
